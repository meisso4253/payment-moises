  async function saveSession(form){

  }
  function toggleTask(id){const task=state.tasks.find(t=>t.id===id);if(!task)return;const previous=task.status,previousCompleted=task.completedAt;
    if(mutate(s=>{const t=s.tasks.find(t=>t.id===id);t.status=t.status==='done'?'todo':'done';t.completedAt=t.status==='done'?new Date().toISOString():null;}))toast(previous==='done'?'Task reopened.':'One less thing on your list. Well done!',false,()=>mutate(s=>{const t=s.tasks.find(t=>t.id===id);if(t){t.status=previous;t.completedAt=previousCompleted;}}));
  }
  async function deleteRecord(kind,id){
    const collection=kind==='task'?'tasks':kind==='subject'?'subjects':kind==='session'?'sessions':'reviewers',record=state[collection].find(r=>r.id===id);if(!record)return;
    const title=kind==='subject'?record.name:record.title;
    const message=kind==='subject'?`Remove “${title}”? Its tasks, study blocks, and reviewers will move to General, not be deleted.`:`Remove “${title}” from your planner? Export a backup first to keep a copy.`;
    if(!await ask(`Delete ${kind==='session'?'study block':kind}?`,message,'Delete',true))return;
    if(mutate(s=>{s[collection]=s[collection].filter(r=>r.id!==id);if(kind==='subject'){s.tasks.forEach(t=>{if(t.subjectId===id)t.subjectId=null;});s.sessions.forEach(t=>{if(t.subjectId===id)t.subjectId=null;});s.reviewers.forEach(t=>{if(t.subjectId===id)t.subjectId=null;});}})){
      if(kind==='subject'&&ui.filters.subject===id){ui.filters.subject='all';render();}if($('#modal').open)closeModal();toast(`${kind==='session'?'Study block':cap(kind)} deleted.`);
    }
  }
  function download(text,name,type='application/json'){
    const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();downloadUrls.push(url);setTimeout(()=>{URL.revokeObjectURL(url);downloadUrls=downloadUrls.filter(v=>v!==url);},60000);
  }
  function exportData(){download(JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),`StudyTrack-backup-${C.dateKey(new Date())}.json`);toast('Backup exported. Keep this file somewhere safe.');}
  async function importData(file){
    if(!file)return;
    if(file.size>8*1024*1024){toast('Backup is too large. Maximum file size is 8 MB.',true);return;}
    let next;
    try{next=C.validateState(JSON.parse(await file.text()));}catch(err){toast(`Cannot import: ${err.message}`,true);return;}
    if(!await ask('Replace this planner?',`This backup contains ${next.tasks.length} tasks, ${next.subjects.length} subjects, and ${next.sessions.length} study blocks, and ${next.reviewers.length} reviewers. Importing replaces everything currently in this planner. Export your current data first to keep it.`,'Import and replace'))return;
    if(commit(next,{force:true})){firstRun=false;ui.filters={query:'',subject:'all',priority:'all',status:'all',period:'all',sort:'deadline'};setView('overview');toast('Backup restored.');}
  }
  function welcome(){openModal(`<div class="welcome-icon">${icon('book')}</div><div class="dialog-body"><h2 id="modalTitle">A calmer place<br>for your student life.</h2><p>Meet StudyTrack. Organize your subjects, keep deadlines in sight, and make a little space to study.</p><div class="field"><label for="welcomeName">What should we call you? (optional)</label><input id="welcomeName" maxlength="40" placeholder="Your first name" autocomplete="off"></div><div class="welcome-options"><button class="button primary" data-act="welcome-sample">${icon('spark')}Try the sample planner</button><button class="button secondary" data-act="welcome-fresh">Start empty ${icon('arrow')}</button></div><p class="welcome-note">No account. No uploads. Data stays in this browser when saving is available. Sample tasks are fictional.</p></div>`,'welcome');}
  async function replacePlanner(mode,initial=false){
    if(!initial&&!await ask(mode==='sample'?'Load the sample planner?':'Start with a clean planner?','This replaces all current tasks, subjects, study blocks, and reviewers. Export your current planner first to keep a copy.',mode==='sample'?'Load sample':'Start fresh',true))return;
    const name=initial?($('#welcomeName')?.value.trim()||''):state.profile.name;
    if(commit(mode==='sample'?C.sample(new Date(),name):C.blank(name),{force:true})){firstRun=false;closeModal();ui.filters={query:'',subject:'all',priority:'all',status:'all',period:'all',sort:'deadline'};setView('overview');toast(mode==='sample'?'Sample planner loaded. All example data is fictional.':'Your planner is ready. Start by adding a subject or a task.');}
  }

  document.addEventListener('click',async event=>{
    const el=event.target.closest('button');if(!el||el.disabled)return;
    if(el.dataset.view){setView(el.dataset.view);return;}
    const act=el.dataset.act,id=el.dataset.id;
    switch(act){
      case 'add-task':openTask();break;case 'edit-task':openTask(id);break;case 'toggle-task':toggleTask(id);break;
      case 'add-subject':openSubject();break;case 'edit-subject':openSubject(id);break;
      case 'add-reviewer':openReviewer();break;case 'edit-reviewer':openReviewer(id);break;case 'toggle-reviewer':toggleReviewer(id);break;case 'delete-reviewer':await deleteRecord('reviewer',id);break;
      case 'add-session':openSession(null,el.dataset.day||null);break;case 'edit-session':openSession(id);break;
      case 'plan-next':openSession(null,null,state.tasks.find(t=>t.id===id)||null);break;
      case 'delete-task':await deleteRecord('task',id);break;case 'delete-subject':await deleteRecord('subject',id);break;case 'delete-session':await deleteRecord('session',id);break;
      case 'close-modal':closeModal();break;case 'confirm-no':answerConfirm(false);break;case 'confirm-yes':answerConfirm(true);break;
      case 'show-tasks':goTasks(el.dataset.period||'all');break;case 'subject-tasks':goTasks('all',id);break;
      case 'task-tab':ui.filters.status=el.dataset.status;updateTaskResults();break;
      case 'clear-filters':ui.filters={query:'',subject:'all',priority:'all',status:'all',period:'all',sort:'deadline'};render();break;
      case 'previous-week':ui.week=C.addDays(ui.week,-7);render();break;case 'next-week':ui.week=C.addDays(ui.week,7);render();break;case 'current-week':ui.week=C.weekStart(new Date());render();break;
      case 'export':exportData();break;case 'import':$('#importFile').value='';$('#importFile').click();break;
      case 'recover':if(corruptRaw)download(corruptRaw,`StudyTrack-unreadable-data-${C.dateKey(new Date())}.txt`,'text/plain');break;
      case 'fresh':await replacePlanner('personal');break;case 'sample':await replacePlanner('sample');break;
      case 'welcome-sample':await replacePlanner('sample',true);break;case 'welcome-fresh':await replacePlanner('personal',true);break;
      case 'print':window.print();break;
    }
  });
  document.addEventListener('submit',event=>{
    const form=event.target;event.preventDefault();
    if(form.id==='taskForm')saveTask(form);
    else if(form.id==='reviewerForm')saveReviewer(form);
    else if(form.id==='subjectForm')saveSubject(form);
    else if(form.id==='sessionForm')saveSession(form);
    else if(form.id==='profileForm'){if(mutate(s=>{s.profile.name=$('#profileName').value.trim();}))toast('Display name updated.');}
  });
  document.addEventListener('input',event=>{if(event.target.id==='taskSearch'){ui.filters.query=event.target.value;updateTaskResults();}});
  document.addEventListener('change',event=>{
    if(event.target.dataset.filter){ui.filters[event.target.dataset.filter]=event.target.value;updateTaskResults();}
    if(event.target.id==='importFile')importData(event.target.files[0]);
  });
  document.addEventListener('keydown',event=>{
    if(event.ctrlKey||event.metaKey||event.altKey||event.target.closest('input,textarea,select,[contenteditable="true"]')||$('dialog[open]'))return;
    if(event.key.toLowerCase()==='n'){event.preventDefault();openTask();}
  });
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(navItems.some(n=>n[0]===v)){ui.view=v;render();}});
  // Recalculate deadline indicators as time passes, without interrupting an open form or search field.
  setInterval(()=>{if(!document.hidden&&!$('dialog[open]')&&!document.activeElement?.matches('input,textarea,select'))render();},60000);
  window.addEventListener('beforeunload',event=>{if(storageIssue&&(state.tasks.length||state.subjects.length||state.sessions.length)){event.preventDefault();event.returnValue='';}});
  shell();render();if(firstRun)welcome();
})();

</script>
</body>
</html>
